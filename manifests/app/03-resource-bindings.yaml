# D2 (part 2) — PLACE each Resource in each environment.
#
# A binding says WHERE a resource may run. It does not say WHICH release: that is
# promotion, and it is a separate, deliberate act, per environment:
#
#   occ apply -f 03-resource-bindings.yaml
#   for r in loans-db loan-events disb-claims; do
#     occ resource promote $r --env development -n kifaru-bank        # D2
#   done
#   … later, D9:  occ resource promote $r --env staging -n kifaru-bank
#
# Until promoted, a binding reports Synced=False "spec.resourceRelease is unset;
# pin a ResourceRelease to deploy this binding" — staging and production sit like
# that, harmlessly, until you promote into them. promote reads the resource's
# status.latestRelease and pins it — no hash is ever copied by hand, and git
# never carries one. Re-run promote after changing a Resource's parameters.
#
# One Resource, three placements: three separate databases, brokers and caches,
# one per cell. Nothing is shared between environments.
---
apiVersion: openchoreo.dev/v1alpha1
kind: ResourceReleaseBinding
metadata:
  name: loans-db-development
  namespace: kifaru-bank
spec:
  owner:
    projectName: lending
    resourceName: loans-db
  environment: development
---
apiVersion: openchoreo.dev/v1alpha1
kind: ResourceReleaseBinding
metadata:
  name: loan-events-development
  namespace: kifaru-bank
spec:
  owner:
    projectName: lending
    resourceName: loan-events
  environment: development
---
apiVersion: openchoreo.dev/v1alpha1
kind: ResourceReleaseBinding
metadata:
  name: disb-claims-development
  namespace: kifaru-bank
spec:
  owner:
    projectName: lending
    resourceName: disb-claims
  environment: development
---
apiVersion: openchoreo.dev/v1alpha1
kind: ResourceReleaseBinding
metadata:
  name: loans-db-staging
  namespace: kifaru-bank
spec:
  owner:
    projectName: lending
    resourceName: loans-db
  environment: staging
---
