# P8 — authorization.
#
# Bindings map a JWT CLAIM to a role. They are not per-user, so onboarding is
# entirely IdP-side: put a user in the group and the platform grants the role
# with no change here.
#
# The shipped developer-binding maps groups=developers with scope {} (cluster
# wide). This one is narrower: the bank's developers get the developer role
# ONLY inside kifaru-bank. A developer from another tenant on the same cluster
# has no access here at all.
#
# ClusterAuthzRoleBinding is cluster-scoped, so its name carries the namespace.
# Verifying the refusal needs an IdP user in the kifaru-bank-developers group —
# IdP admin work, outside OpenChoreo.
---
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRoleBinding
metadata:
  name: kifaru-bank-developers-binding
spec:
  effect: allow
  entitlement:
    claim: groups
    value: kifaru-bank-developers
  roleMappings:
    - roleRef:
        kind: ClusterAuthzRole
        name: developer
      scope:
        namespace: kifaru-bank
